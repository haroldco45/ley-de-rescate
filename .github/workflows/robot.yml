name: Robot Ley de Rescate

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: robot-ley-rescate
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer noticias, fotos y videos de la Ley de Rescate
        run: node scripts/robot.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          if git diff --staged --quiet; then
            echo "Nada nuevo"
          else
            git commit -m "Ley de Rescate $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
